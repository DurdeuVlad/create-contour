displayURL = "https://github.com/DurdeuVlad/create-contour"
issueTrackerURL = "https://github.com/DurdeuVlad/create-contour/issues"
credits = "Built on Create by the Create team / Creators of Create (MIT code; Create assets are All Rights Reserved and not reused)."

[[dependencies.create_contour]]
