# Project identity
mod_group=net.createcontour
mod_id=create_contour
mod_version=0.2.1-alpha

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.caching=true
org.gradle.parallel=false

# Toolchain
java_version=21

# ---------------------------------------------------------------------------
# Compatibility profiles. Select with: -PcompatProfile=pack|legacy
# Default (omitted): pack. Any other value fails the build.
# ---------------------------------------------------------------------------

# PRIMARY (pack): declared target = Rustic Craft 2 stable 2.2.2 pack profile.
# Create coordinate pinned to official Maven artifact whose manifest Git-Hash
# equals the mc1.21.1-6.0.10 tag (ac0c444d9828da3453ae8cc65338e8de063286fb).
neoforge_pack=21.1.248
create_pack=6.0.10-280
jei_pack=19.57.0.449
# Ponder API is compile-only (Create types implement its interfaces).
ponder_coord_pack=net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1

# LEGACY (prompt baseline): requested Registrate MC1.21-1.3.0+62 is NOT
# satisfiable - the +62 artifact is absent from the canonical tterrag maven
# and Create 6.0.8-168 bundles Registrate +67 with range [+67,).
# DEVIATION (technical, not owner-approved): legacy uses the REQUIRED +67
# (arrives via Create's JarJar). Requested Ponder 1.0.66 remains the
# runtime target via an explicit runtime dep (Create 6.0.8 bundles 1.0.64).
neoforge_legacy=21.1.213
create_legacy=6.0.8-168
jei_legacy=19.21.0.247
ponder_legacy=1.0.66
ponder_coord_legacy=net.createmod.ponder:Ponder-NeoForge-1.21.1:1.0.66
